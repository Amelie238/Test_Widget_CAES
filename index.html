<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAES 2026</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root {
    --ink: #1f2a37;
    --muted: #5b6776;
    --line: rgba(31, 42, 55, .14);
    --page: #fbfbfd;
    --card: #ffffff;

    --hm-bg: #e6eefa;  --hm-head: #c9dcf5;  --hm-ink: #24456e;
    --shn-bg: #e4f3e6; --shn-head: #c6e5ca; --shn-ink: #2a5632;
    --aut-bg: #eee8f8; --aut-head: #dcd0f0; --aut-ink: #4a3a73;

    --st-todo: #d9822b;
    --st-done: #2e8b8b;
    --st-closed: #8a94a3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--page);
    padding: 18px 20px 28px;
    font-size: 14px;
    line-height: 1.4;
  }
  h1 {
    margin: 0 0 14px;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -.01em;
  }
  .search {
    position: relative;
    max-width: 560px;
    margin-bottom: 20px;
  }
  .search input {
    width: 100%;
    padding: 11px 38px 11px 14px;
    font: inherit;
    font-size: 15px;
    color: var(--ink);
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    outline: none;
  }
  .search input:focus { border-color: #6d8fc4; box-shadow: 0 0 0 3px rgba(109,143,196,.2); }
  .search button {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    border: 0; background: transparent; font-size: 18px; color: var(--muted);
    cursor: pointer; padding: 4px 8px; display: none;
  }
  .search.has-text button { display: block; }

  .notice {
    padding: 14px 16px; border-radius: 10px; background: #fff4e0; color: #6b4a14;
    margin-bottom: 16px; display: none;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 16px;
    align-items: start;
  }
  .panel {
    border-radius: 14px;
    background: var(--bg);
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .panel.hm  { --bg: var(--hm-bg);  --head: var(--hm-head);  --tint: var(--hm-ink); }
  .panel.shn { --bg: var(--shn-bg); --head: var(--shn-head); --tint: var(--shn-ink); }
  .panel.aut { --bg: var(--aut-bg); --head: var(--aut-head); --tint: var(--aut-ink); }

  .panel-head {
    background: var(--head);
    color: var(--tint);
    padding: 14px 16px 12px;
  }
  .panel-head h2 { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.25; }
  .panel-head .total { margin-top: 2px; font-size: 13px; opacity: .85; }

  .group { border-top: 1px solid var(--line); }
  .group > summary {
    list-style: none;
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px;
    font-weight: 600;
    color: var(--tint);
    user-select: none;
  }
  .group > summary::-webkit-details-marker { display: none; }
  .group > summary::before {
    content: "▸"; font-size: 12px; transition: transform .15s;
  }
  .group[open] > summary::before { transform: rotate(90deg); }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .dot.todo { background: var(--st-todo); }
  .dot.done { background: var(--st-done); }
  .dot.closed { background: var(--st-closed); }
  .count {
    margin-left: auto;
    background: rgba(255,255,255,.75);
    border-radius: 999px;
    padding: 1px 10px;
    font-size: 12.5px;
    font-weight: 700;
  }
  .list { padding: 2px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
  .empty { padding: 4px 6px 4px; color: var(--muted); font-size: 13px; }

  .dossier {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .dossier > summary {
    list-style: none; cursor: pointer;
    padding: 9px 12px;
    display: flex; flex-direction: column; gap: 1px;
  }
  .dossier > summary::-webkit-details-marker { display: none; }
  .dossier .name { font-weight: 600; }
  .dossier .num { color: var(--muted); font-size: 12.5px; }
  .dossier[open] { box-shadow: 0 2px 10px rgba(31,42,55,.08); }
  .body { padding: 2px 12px 12px; border-top: 1px dashed var(--line); }
  .info { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 10px 0; font-size: 13px; }
  .info dt { color: var(--muted); }
  .info dd { margin: 0; word-break: break-word; }
  .avis label { display: block; font-weight: 600; margin: 8px 0 4px; font-size: 13px; }
  .avis textarea {
    width: 100%; min-height: 78px; resize: vertical;
    font: inherit; padding: 8px 10px;
    border: 1.5px solid var(--line); border-radius: 8px;
    background: #fff; color: var(--ink); outline: none;
  }
  .avis textarea:focus { border-color: #6d8fc4; box-shadow: 0 0 0 3px rgba(109,143,196,.2); }
  .avis .actions { display: flex; align-items: center; gap: 10px; margin-top: 6px; min-height: 30px; }
  .avis button {
    font: inherit; font-weight: 600; font-size: 13px;
    padding: 6px 14px; border-radius: 8px; border: 0; cursor: pointer;
    background: var(--tint); color: #fff;
  }
  .avis button:disabled { opacity: .45; cursor: default; }
  .avis .msg { font-size: 12.5px; color: var(--muted); }
  .avis .msg.err { color: #b3261e; }
  .avis .none { color: var(--muted); font-size: 13px; margin-top: 8px; }

  .diag { margin: -8px 0 18px; font-size: 13px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; }
  .diag > summary { cursor: pointer; padding: 8px 0; color: var(--muted); font-weight: 600; }
  .diag.warn { background: #fff4e0; border-color: #e8c48a; }
  .diag.warn > summary { color: #6b4a14; }
  .diag table { border-collapse: collapse; margin: 2px 0 10px; width: 100%; }
  .diag th, .diag td { text-align: left; padding: 3px 10px 3px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .diag code { background: rgba(31,42,55,.07); padding: 0 4px; border-radius: 4px; word-break: break-all; }
  .diag h3 { margin: 8px 0 4px; font-size: 13px; }
  .dossier .name strong { margin-right: 8px; }
  .dossier .bac { color: var(--muted); font-size: 12.5px; }
  .avis + .avis { margin-top: 10px; }
  .avis .lbl { font-weight: 600; font-size: 13px; margin: 10px 0 4px; }
  .choices { display: flex; gap: 18px; flex-wrap: wrap; }
  .choices label { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; margin: 0; cursor: pointer; }
  .choices input { width: 17px; height: 17px; cursor: pointer; }
  .hidden { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<h1>CAES 2026</h1>

<div class="search" id="searchBox">
  <input id="search" type="search" placeholder="Rechercher par nom, prénom ou numéro de dossier" autocomplete="off" aria-label="Rechercher un dossier">
  <button type="button" id="clear" aria-label="Effacer la recherche">×</button>
</div>

<div class="notice" id="notice"></div>
<details class="diag" id="diag" hidden></details>
<div class="grid" id="grid"></div>

<script>
(function () {
  "use strict";

  /* ---------- Configuration ---------- */
  var CATEGORIES = [
    { key: "hm",  css: "hm",  title: "Handicap / Médical", avisField: "AvisMedecin",  avisLabel: "Avis du médecin" },
    { key: "shn", css: "shn", title: "SHN", avisField: "AvisMaison", avisLabel: "Avis de la Maison de la Performance" },
    { key: "aut", css: "aut", title: "Autres situations (mutation, chargé de famille, mandat électoral…)", avisField: null }
  ];
  var STATES = [
    { key: "todo",   label: "À traiter", open: true },
    { key: "done",   label: "Traités",   open: false },
    { key: "closed", label: "Clôturés",  open: false }
  ];

  // Colonnes à associer dans le panneau de configuration du widget Grist
  var COLUMN_DEFS = [
    { name: "Nom",           title: "Nom",                  type: "Any" },
    { name: "Prenom",        title: "Prénom",               type: "Any" },
    { name: "NumeroDossier", title: "Numéro de dossier",    type: "Any" },
    { name: "TypeSaisine",   title: "Type de saisine",      type: "Any", description: "Détermine la catégorie : Handicap/Médical, SHN ou Autres situations" },
    { name: "SituationFinale", title: "Situation finale",   type: "Any", description: "À traiter, Traité ou Clôturé" },
    { name: "AvisMedecin",   title: "Avis médecin",         type: "Any", description: "Modifiable pour les saisines Handicap/Médical" },
    { name: "AvisMaison",    title: "Avis Maison de la Performance", type: "Any", description: "Modifiable pour les saisines SHN" },
    { name: "TypeBac",           title: "Type de bac (facultatif)",          type: "Any", optional: true },
    { name: "SpecialiteBac",     title: "Spécialité du bac (facultatif)",    type: "Any", optional: true },
    { name: "FormationDemandee", title: "Formation demandée (facultatif)",   type: "Any", optional: true },
    { name: "Etablissement",     title: "Établissement concerné (facultatif)", type: "Any", optional: true },
    { name: "AvisEtablissement", title: "Avis étab / université (facultatif)", type: "Any", optional: true, description: "Reçoit « Avis favorable » ou « Avis défavorable »" },
    { name: "Sport",             title: "Sport concerné – SHN (facultatif)", type: "Any", optional: true },
    { name: "ListeMinisterielle", title: "Inscription sur liste ministérielle – SHN (facultatif)", type: "Any", optional: true },
    { name: "AutreProposition",  title: "Autre proposition envisageable (facultatif)", type: "Any", optional: true },
    { name: "FormationProposee", title: "Formation proposée (facultatif)",   type: "Any", optional: true }
  ];

  // Si une colonne n'est pas associée dans le panneau, on cherche une colonne de même nom
  var FALLBACK = {
    Nom:               /^nom$/,
    Prenom:            /^pre?nom$/,
    NumeroDossier:     /dossier/,
    TypeSaisine:       /saisine/,
    SituationFinale:   /^situationfinale/,
    AvisMedecin:       /^avism?e?decin/,
    AvisMaison:        /^avis.*maison/,
    TypeBac:           /^(typede)?bac$|^typebac/,
    SpecialiteBac:     /specialit/,
    FormationDemandee: /^formationdemand/,
    Etablissement:     /^etablissement/,
    AvisEtablissement: /^avis.*(tab|univ)/,
    Sport:             /sport/,
    ListeMinisterielle:/listemin|ministeri/,
    AutreProposition:  /autreproposition|propositionenvisag/,
    FormationProposee: /^formationpropos/
  };
  var colOf = {};      // nom logique -> clé réellement présente dans les enregistrements
  var rawKeys = [];

  /* ---------- État ---------- */
  var records = [];
  var query = "";
  var openDossiers = {};   // id -> true
  var openGroups = {};     // "cat|state" -> true/false (choix de l'utilisateur)
  var pendingRender = false;
  var forcedNotice = "";

  var grid = document.getElementById("grid");
  var notice = document.getElementById("notice");
  var searchInput = document.getElementById("search");
  var searchBox = document.getElementById("searchBox");

  /* ---------- Utilitaires ---------- */
  function norm(s) {
    return String(s == null ? "" : s)
      .toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }
  function lettersOnly(s) { return norm(s).replace(/[^a-z]/g, ""); }

  function asText(v) {
    if (v == null) return "";
    if (typeof v === "boolean") return v ? "Oui" : "Non";
    if (Array.isArray(v)) {                       // Choice List : ["L", "a", "b"]
      return v.filter(function (x) { return x !== "L"; }).join(", ");
    }
    if (typeof v === "object") {
      var t = v.display || v.label || v.name || v.value;
      return t != null ? String(t) : JSON.stringify(v);
    }
    return String(v);
  }

  function resolveCols(rec) {
    rawKeys = Object.keys(rec).filter(function (k) { return k !== "id"; });
    colOf = {};
    Object.keys(FALLBACK).forEach(function (name) {
      if (name in rec) { colOf[name] = name; return; }
      for (var i = 0; i < rawKeys.length; i++) {
        if (FALLBACK[name].test(lettersOnly(rawKeys[i]))) { colOf[name] = rawKeys[i]; break; }
      }
    });
  }
  function get(rec, name) { var k = colOf[name]; return k === undefined ? undefined : rec[k]; }
  function val(rec, name) { return asText(get(rec, name)); }

  var LABEL_CAT = { hm: "Handicap / Médical", shn: "SHN", aut: "Autres situations" };
  var LABEL_ST = { todo: "À traiter", done: "Traités", closed: "Clôturés" };

  function categoryOfValue(raw) {
    var t = lettersOnly(asText(raw));
    if (/handicap|medic|rqth|sante/.test(t)) return "hm";
    if (/shn|hautniveau/.test(t)) return "shn";
    return "aut";
  }
  function categoryOf(rec) { return categoryOfValue(get(rec, "TypeSaisine")); }

  function stateOfValue(raw) {
    var s = lettersOnly(asText(raw));
    if (/clotur/.test(s)) return "closed";
    if (/traiter/.test(s) || s === "") return "todo";
    if (/traite/.test(s)) return "done";
    return "todo";
  }
  function stateOf(rec) { return stateOfValue(get(rec, "SituationFinale")); }

  function el(tag, props, children) {
    var node = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      if (k === "class") node.className = props[k];
      else if (k === "text") node.textContent = props[k];
      else node.setAttribute(k, props[k]);
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  function hasDirtyEditor() {
    return !!grid.querySelector("textarea[data-dirty='1']");
  }

  /* ---------- Rendu ---------- */
  function matches(rec) {
    if (!query) return true;
    var q = norm(query).trim();
    if (!q) return true;
    var hay = [val(rec, "Nom"), val(rec, "Prenom"), val(rec, "NumeroDossier"),
               val(rec, "Prenom") + " " + val(rec, "Nom"),
               val(rec, "Nom") + " " + val(rec, "Prenom")].map(norm).join("|");
    return hay.indexOf(q) !== -1;
  }

  function sortRecs(a, b) {
    var na = norm(val(a, "Nom") + " " + val(a, "Prenom"));
    var nb = norm(val(b, "Nom") + " " + val(b, "Prenom"));
    return na < nb ? -1 : na > nb ? 1 : 0;
  }

  function render() {
    if (hasDirtyEditor()) { pendingRender = true; return; }
    pendingRender = false;
    grid.textContent = "";

    if (forcedNotice) {
      notice.style.display = "block";
      notice.textContent = forcedNotice;
    } else if (!records.length) {
      notice.style.display = "block";
      notice.textContent = "Aucun dossier à afficher. Vérifiez que le widget est lié à la table des demandes CAES.";
    } else {
      notice.style.display = "none";
    }

    var buckets = {};
    CATEGORIES.forEach(function (c) {
      buckets[c.key] = { todo: [], done: [], closed: [] };
    });
    records.forEach(function (r) {
      if (!matches(r)) return;
      buckets[categoryOf(r)][stateOf(r)].push(r);
    });

    CATEGORIES.forEach(function (cat) {
      var b = buckets[cat.key];
      var total = b.todo.length + b.done.length + b.closed.length;
      var panel = el("section", { class: "panel " + cat.css }, [
        el("div", { class: "panel-head" }, [
          el("h2", { text: cat.title }),
          el("div", { class: "total", text: total + (total > 1 ? " dossiers" : " dossier") })
        ])
      ]);

      STATES.forEach(function (st) {
        var list = b[st.key].sort(sortRecs);
        var gkey = cat.key + "|" + st.key;
        var isOpen = openGroups.hasOwnProperty(gkey) ? openGroups[gkey] : st.open;
        if (query && list.length) isOpen = true;

        var group = el("details", { class: "group" }, [
          el("summary", null, [
            el("span", { class: "dot " + st.key }),
            el("span", { text: st.label }),
            el("span", { class: "count", text: String(list.length) })
          ])
        ]);
        if (isOpen) group.open = true;
        group.addEventListener("toggle", function () { openGroups[gkey] = group.open; });

        var wrap = el("div", { class: "list" });
        if (!list.length) wrap.appendChild(el("div", { class: "empty", text: "Aucun dossier" }));
        list.forEach(function (r) { wrap.appendChild(renderDossier(r, cat)); });
        group.appendChild(wrap);
        panel.appendChild(group);
      });

      grid.appendChild(panel);
    });
    renderDiag();
  }

  function renderDiag() {
    var diag = document.getElementById("diag");
    if (!records.length) { diag.hidden = true; return; }
    function table(title, field, classify, labels) {
      var seen = {};
      records.forEach(function (r) {
        var v = get(r, field);
        var k = JSON.stringify(v === undefined ? null : v);
        if (!seen[k]) seen[k] = { n: 0, raw: v };
        seen[k].n++;
      });
      var rows = Object.keys(seen).sort(function (a, b) { return seen[b].n - seen[a].n; }).slice(0, 15);
      var t = el("table", null, [el("tr", null, [
        el("th", { text: "Valeur lue" }), el("th", { text: "Dossiers" }), el("th", { text: "Classée dans" })])]);
      rows.forEach(function (k) {
        t.appendChild(el("tr", null, [
          el("td", null, [el("code", { text: k })]),
          el("td", { text: String(seen[k].n) }),
          el("td", { text: labels[classify(seen[k].raw)] })]));
      });
      return [el("h3", { text: title }), t];
    }
    diag.textContent = "";
    var anyKnown = records.some(function (r) { return categoryOf(r) !== "aut"; });
    diag.className = "diag" + (anyKnown ? "" : " warn");
    diag.open = !anyKnown;
    diag.appendChild(el("summary", { text: anyKnown
      ? "Contrôle des données lues (type de saisine, situation finale)"
      : "⚠ Aucun dossier reconnu en Handicap/Médical ou SHN : voici ce que le widget reçoit" }));
    table("Colonne associée à « Type de saisine »", "TypeSaisine", categoryOfValue, LABEL_CAT)
      .concat(table("Colonne associée à « Situation finale »", "SituationFinale", stateOfValue, LABEL_ST))
      .forEach(function (n) { diag.appendChild(n); });
    diag.appendChild(el("h3", { text: "Colonnes reçues du widget" }));
    diag.appendChild(el("div", { text: rawKeys.join(", ") || "(aucune)" }));
    diag.appendChild(el("h3", { text: "Colonnes utilisées" }));
    diag.appendChild(el("div", { text: Object.keys(FALLBACK).map(function (n) {
      return n + " → " + (colOf[n] === undefined ? "non trouvée" : colOf[n]);
    }).join(" · ") }));
    diag.hidden = false;
  }

  function saveField(rec, name, value) {
    var column = colOf[name];
    var table = (column === name) ? grist.selectedTable : grist.getTable();
    var fields = {}; fields[column] = value;
    return table.update({ id: rec.id, fields: fields });
  }

  // Zone de texte modifiable liée à une colonne
  function textEditor(rec, name, label, placeholder) {
    var wrap = el("div", { class: "avis" });
    var column = colOf[name];
    if (column === undefined) {
      wrap.appendChild(el("div", { class: "none", text: "Colonne « " + label + " » introuvable : associez-la dans le panneau du widget." }));
      return wrap;
    }
    var id = name + "-" + rec.id;
    var original = asText(rec[column]);
    var ta = el("textarea", { id: id, "aria-label": label });
    if (placeholder) ta.placeholder = placeholder;
    ta.value = original;
    var btn = el("button", { type: "button", text: "Enregistrer" });
    btn.disabled = true;
    var msg = el("span", { class: "msg" });

    ta.addEventListener("input", function () {
      var dirty = ta.value !== original;
      ta.setAttribute("data-dirty", dirty ? "1" : "0");
      btn.disabled = !dirty;
      msg.textContent = dirty ? "Modification non enregistrée" : "";
      msg.className = "msg";
    });

    function save() {
      if (ta.getAttribute("data-dirty") !== "1") return;
      btn.disabled = true;
      msg.className = "msg";
      msg.textContent = "Enregistrement…";
      saveField(rec, name, ta.value).then(function () {
        original = ta.value;
        ta.setAttribute("data-dirty", "0");
        msg.textContent = "Enregistré ✓";
        if (pendingRender) render();
      }).catch(function (e) {
        btn.disabled = false;
        msg.className = "msg err";
        msg.textContent = "Échec de l’enregistrement : " + (e && e.message ? e.message : e);
      });
    }
    btn.addEventListener("click", save);
    ta.addEventListener("blur", function () {
      setTimeout(function () { if (document.activeElement !== btn) save(); }, 0);
    });

    wrap.appendChild(el("label", { for: id, text: label }));
    wrap.appendChild(ta);
    wrap.appendChild(el("div", { class: "actions" }, [btn, msg]));
    return wrap;
  }

  // Avis de l'établissement : Favorable / Défavorable (cases à cocher exclusives)
  function etabEditor(rec) {
    var box = el("div");
    var wrap = el("div", { class: "avis" });
    var column = colOf.AvisEtablissement;
    wrap.appendChild(el("div", { class: "lbl", text: "Avis établissement / université" }));
    if (column === undefined) {
      wrap.appendChild(el("div", { class: "none", text: "Colonne « Avis étab / université » introuvable : associez-la dans le panneau du widget." }));
      box.appendChild(wrap);
      return box;
    }
    var raw = lettersOnly(asText(rec[column]));
    var choice = /defavorable/.test(raw) ? "def" : /favorable/.test(raw) ? "fav" : "";

    var cbFav = el("input", { type: "checkbox" });
    var cbDef = el("input", { type: "checkbox" });
    cbFav.checked = choice === "fav";
    cbDef.checked = choice === "def";
    var msg = el("span", { class: "msg" });
    var extra = textEditor(rec, "AutreProposition", "Autre proposition envisageable", "Saisir une autre proposition…");
    extra.classList.toggle("hidden", choice !== "def");

    function apply(next, source) {
      choice = next;
      cbFav.checked = next === "fav";
      cbDef.checked = next === "def";
      extra.classList.toggle("hidden", next !== "def");
      msg.className = "msg";
      msg.textContent = "Enregistrement…";
      var text = next === "fav" ? "Avis favorable" : next === "def" ? "Avis défavorable" : "";
      saveField(rec, "AvisEtablissement", text).then(function () {
        msg.textContent = "Enregistré ✓";
      }).catch(function (e) {
        msg.className = "msg err";
        msg.textContent = "Échec de l’enregistrement : " + (e && e.message ? e.message : e);
      });
    }
    cbFav.addEventListener("change", function () { apply(cbFav.checked ? "fav" : "", cbFav); });
    cbDef.addEventListener("change", function () { apply(cbDef.checked ? "def" : "", cbDef); });

    wrap.appendChild(el("div", { class: "choices" }, [
      el("label", null, [cbFav, el("span", { text: "Avis favorable" })]),
      el("label", null, [cbDef, el("span", { text: "Avis défavorable" })])
    ]));
    wrap.appendChild(el("div", { class: "actions" }, [msg]));
    box.appendChild(wrap);
    box.appendChild(extra);
    return box;
  }

  function infoList(rec, pairs) {
    var dl = el("dl", { class: "info" });
    pairs.forEach(function (pair) {
      var v = val(rec, pair[1]);
      if (v) {
        dl.appendChild(el("dt", { text: pair[0] }));
        dl.appendChild(el("dd", { text: v }));
      }
    });
    return dl.children.length ? dl : null;
  }

  function renderDossier(rec, cat) {
    var nameStr = (val(rec, "Nom") + " " + val(rec, "Prenom")).trim() || "(sans nom)";
    var num = val(rec, "NumeroDossier");
    var bacType = val(rec, "TypeBac");
    var bacSpe = val(rec, "SpecialiteBac");
    var bacLine = [];
    if (bacType) bacLine.push("Bac : " + bacType);
    if (bacSpe) bacLine.push(bacSpe);

    var d = el("details", { class: "dossier" }, [
      el("summary", null, [
        el("span", { class: "name" }, [
          el("strong", { text: num || "N° ?" }),
          document.createTextNode(nameStr)
        ]),
        bacLine.length ? el("span", { class: "bac", text: bacLine.join("  ·  ") }) : null
      ])
    ]);
    if (openDossiers[rec.id]) d.open = true;
    d.addEventListener("toggle", function () {
      if (d.open) openDossiers[rec.id] = true; else delete openDossiers[rec.id];
    });

    var body = el("div", { class: "body" });
    var pairs1 = [["Type de saisine", "TypeSaisine"]];
    if (cat.key === "shn") {
      pairs1.push(["Sport concerné", "Sport"], ["Inscription sur liste ministérielle", "ListeMinisterielle"]);
    }
    pairs1.push(["Formation demandée", "FormationDemandee"], ["Établissement concerné", "Etablissement"]);
    var dl1 = infoList(rec, pairs1);
    if (dl1) body.appendChild(dl1);

    body.appendChild(etabEditor(rec));

    var dl2 = infoList(rec, [["Formation proposée", "FormationProposee"]]);
    if (dl2) body.appendChild(dl2);

    if (cat.avisField) {
      var avisWrap = el("div", { class: "avis" });
      avisWrap.appendChild(textEditor(rec, cat.avisField, cat.avisLabel));
      body.appendChild(avisWrap);
    } else {
      body.appendChild(el("div", { class: "avis" }, [
        el("div", { class: "none", text: "Pas d’avis médecin / Maison de la Performance pour cette catégorie." })]));
    }
    d.appendChild(body);
    return d;
  }

  /* ---------- Recherche ---------- */
  searchInput.addEventListener("input", function () {
    query = searchInput.value;
    searchBox.classList.toggle("has-text", !!query);
    render();
  });
  document.getElementById("clear").addEventListener("click", function () {
    searchInput.value = ""; query = "";
    searchBox.classList.remove("has-text");
    render(); searchInput.focus();
  });

  /* ---------- Grist ---------- */
  // Les 3 catégories s'affichent tout de suite, même avant l'arrivée des données
  render();

  if (typeof grist === "undefined") {
    forcedNotice = "Le widget n’est pas chargé depuis Grist (ou la bibliothèque Grist est bloquée) : " +
      "aucune donnée ne peut être lue. Ouvrez-le comme widget personnalisé dans votre document Grist.";
    render();
    return;
  }

  grist.ready({ requiredAccess: "full", columns: COLUMN_DEFS });
  grist.onRecords(function (recs) {
    forcedNotice = "";
    records = recs || [];
    if (records.length) resolveCols(records[0]);
    render();
  });

  // Aucune donnée reçue au bout de 4 s : table non liée ou colonnes non associées
  setTimeout(function () {
    if (!records.length && !forcedNotice) {
      forcedNotice = "Aucune donnée reçue de Grist. Ouvrez le panneau du widget : choisissez la table " +
        "des demandes CAES dans « Sélectionner les données », puis associez chaque colonne " +
        "(Nom, Prénom, Numéro de dossier, Type de saisine, Situation finale, Avis…) avant de vérifier l’accès complet.";
      render();
    }
  }, 4000);
})();
</script>
</body>
</html>
